name: Portfolio project checks

on:
  push:
    paths:
      - "projects/rag-workbench/**"
      - ".github/workflows/portfolio-checks.yml"
  pull_request:
    paths:
      - "projects/rag-workbench/**"
      - ".github/workflows/portfolio-checks.yml"

permissions:
  contents: read

jobs:
  rag-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rag-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/rag-workbench/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src pytest -q
